<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂实践中心 · 高级网页设计</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
        font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
        background:#f6f8fc;color:#1f2937;
        min-height:100vh;
    }
    .hub-wrap{max-width:1000px;margin:0 auto;padding:40px 20px 60px}

    /* 头部 */
    .hub-head{
        background:linear-gradient(135deg,#0f2b5b,#1d5bbf);
        border-radius:20px;padding:36px 38px;color:#fff;
        box-shadow:0 12px 30px rgba(15,43,91,.3);margin-bottom:28px;
    }
    .hub-head .hub-badge{
        display:inline-block;padding:5px 14px;border-radius:999px;
        background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
        font-size:13px;letter-spacing:2px;margin-bottom:14px;
    }
    .hub-head h1{font-size:30px;letter-spacing:1px;line-height:1.4}
    .hub-head h1 b{color:#ffd166}
    .hub-head p{margin-top:12px;font-size:14.5px;color:#d9e3f5;line-height:2}

    /* 卡片列表 */
    .hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
    .hub-card{
        background:#fff;border:1px solid #e8ecf5;border-radius:18px;
        padding:26px 28px;box-shadow:0 4px 14px rgba(31,41,55,.06);
        text-decoration:none;color:inherit;display:block;
        transition:transform .25s,box-shadow .25s,border-color .25s;
        position:relative;overflow:hidden;
    }
    .hub-card::before{
        content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
        background:linear-gradient(#0f2b5b,#1d5bbf);
    }
    .hub-card:hover{
        transform:translateY(-4px);
        box-shadow:0 14px 30px rgba(15,43,91,.16);
        border-color:#c7d8f8;
    }
    .hub-card .hub-icon{font-size:26px;margin-bottom:10px;display:block}
    .hub-card h2{font-size:19px;color:#111827;margin-bottom:8px}
    .hub-card p{font-size:14px;color:#6b7280;line-height:1.9;min-height:52px}
    .hub-card .hub-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
    .hub-card .hub-tags i{
        font-style:normal;font-size:12px;color:#1d5bbf;
        background:#e8f0ff;border:1px solid #c7d8f8;
        padding:3px 10px;border-radius:999px;
    }
    .hub-card .hub-go{
        display:inline-block;margin-top:16px;font-size:13.5px;
        font-weight:bold;color:#e8890c;
    }

    footer{text-align:center;margin-top:36px;color:#9ca3af;font-size:13px;line-height:2}
</style>
</head>
<body>
<div class="hub-wrap">

    <div class="hub-head">
        <span class="hub-badge">高 级 网 页 设 计 · 课 堂 实 践 中 心</span>
        <h1>高级网页设计 · <b>课堂实践中心</b></h1>
        <p>这里汇总了课堂上的实践作品与操作任务，点击下方卡片即可进入对应页面。</p>
    </div>

    <div class="hub-grid">

        <a class="hub-card" href="stock-rank.html">
            <span class="hub-icon">📈</span>
            <h2>股票排行榜</h2>
            <p>沪涨 / 沪跌 / 深涨 / 深跌 四个选项卡，切换股票涨跌榜单，练习 Tab 选项卡的交互实现。</p>
            <div class="hub-tags"><i>Tab 选项卡</i><i>DOM 操作</i><i>事件监听</i></div>
            <span class="hub-go">进入页面 →</span>
        </a>

        <a class="hub-card" href="swiper-task.html">
            <span class="hub-icon">🎞️</span>
            <h2>Swiper 轮播课堂任务</h2>
            <p>大国重器光影展：四个轮播任务，从最小可拖动轮播，到圆点箭头、自动播放与六种切换效果。</p>
            <div class="hub-tags"><i>Swiper</i><i>轮播</i><i>autoplay</i><i>effect</i></div>
            <span class="hub-go">进入页面 →</span>
        </a>

    </div>

    <footer>课堂实践中心 · 高级网页设计 · 2026-2027-1</footer>
</div>
</body>
</html>
